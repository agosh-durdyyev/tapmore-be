services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tapmore
      POSTGRES_PASSWORD: tapmore_local
      POSTGRES_DB: tapmore
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tapmore']
      interval: 5s
      retries: 10
volumes:
  postgres_data:
